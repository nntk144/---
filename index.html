<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상하이 스마트 인터랙티브 여행 Web App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }

        /* Glow Animation & Effects */
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
        }
        .map-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Tab content animations */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .map-container {
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
        }

        /* Image Zoom Hover effect */
        .img-zoom {
            transition: transform 0.3s ease;
        }
        .img-zoom:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-100">

                ]

        ];

        let currentPlaceId = 'bund';
        let currentFilter = 'all';
        let bookmarks = JSON.parse(localStorage.getItem('shanghai_bookmarks') || '[]');
        let isBookmarkOnly = false;
        let currentSlideIndex = 0;

        // Initialize Web Application
        window.onload = function() {
            updateCounts();
            renderMapPins();
            renderPlaceList();
            renderDetailPanel(currentPlaceId);
            updateBookmarkBadge();
        };

        function updateCounts() {
            document.getElementById('count-all').innerText = placesData.length;
        }

        function updateBookmarkBadge() {
            document.getElementById('bookmark-count-badge').innerText = bookmarks.length;
        }

        function toggleBookmark(id, event) {
            if (event) event.stopPropagation();
            
            const index = bookmarks.indexOf(id);
            if (index > -1) {
                bookmarks.splice(index, 1);
            } else {
                bookmarks.push(id);
            }
            localStorage.setItem('shanghai_bookmarks', JSON.stringify(bookmarks));
            
            updateBookmarkBadge();
            renderMapPins();
            renderPlaceList();
            renderDetailPanel(currentPlaceId);
        }

        function toggleBookmarkFilter() {
            isBookmarkOnly = !isBookmarkOnly;
            const btn = document.getElementById('btn-bookmark-filter');
            if (isBookmarkOnly) {
                btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-400 text-slate-950 transition flex items-center gap-1.5 font-bold";
            } else {
                btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5";
            }
            renderMapPins();
            renderPlaceList();
        }

        // Render Dynamic Interactive Map Pins
        function renderMapPins() {
            const container = document.getElementById('map-pins-container');
            container.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            placesData.forEach(place => {
                const matchesCategory = currentFilter === 'all' || place.category === currentFilter;
                const matchesSearch = place.name.toLowerCase().includes(searchTerm) || place.shortDesc.toLowerCase().includes(searchTerm);
                const matchesBookmark = !isBookmarkOnly || bookmarks.includes(place.id);

                if (!matchesCategory || !matchesSearch || !matchesBookmark) return;

                const isSelected = place.id === currentPlaceId;
                const isBookmarked = bookmarks.includes(place.id);
                
                const pin = document.createElement('div');
                pin.className = `absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-all duration-300 ${isSelected ? 'z-30 scale-125' : 'z-10 hover:scale-110 hover:z-20'}`;
                pin.style.top = place.mapPos.top;
                pin.style.left = place.mapPos.left;
                pin.onclick = () => selectPlace(place.id);

                const badgeBg = place.isMajor 
                    ? (isSelected ? 'bg-amber-400 text-slate-950 ring-2 ring-amber-300 glow-amber' : 'bg-amber-500/20 text-amber-300 border border-amber-400/40')
                    : (isSelected ? 'bg-sky-400 text-slate-950 ring-2 ring-sky-300' : 'bg-slate-900/90 text-slate-300 border border-slate-700');

                const pinIconBg = isSelected
                    ? 'bg-amber-400 text-slate-950 ring-4 ring-amber-400/40 map-pulse'
                    : (place.isMajor ? 'bg-slate-900 text-amber-400 border border-amber-400' : 'bg-slate-800 text-slate-300 border border-slate-600');

                pin.innerHTML = `
                    <div class="flex flex-col items-center group">
                        <span class="text-[10px] px-2 py-0.5 rounded-md font-bold shadow-lg mb-1 whitespace-nowrap transition-all flex items-center gap-1 ${badgeBg}">
                            ${isBookmarked ? '<i class="fa-solid fa-bookmark text-[9px] text-amber-400"></i>' : ''}
                            ${place.name.split(' ')[0]} ${place.isMajor ? '★' : ''}
                        </span>
                        <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all ${pinIconBg}">
                            <i class="fa-solid ${place.icon}"></i>
                        </div>
                    </div>
                `;
                container.appendChild(pin);
            });
        }

        // Render Left Panel Place Cards Selection List
        function renderPlaceList() {
            const container = document.getElementById('place-list');
            container.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredPlaces = placesData.filter(p => {
                const matchesCategory = currentFilter === 'all' || p.category === currentFilter;
                const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.shortDesc.toLowerCase().includes(searchTerm);
                const matchesBookmark = !isBookmarkOnly || bookmarks.includes(p.id);
                return matchesCategory && matchesSearch && matchesBookmark;
            });

            document.getElementById('filtered-count').innerText = filteredPlaces.length;

            if (filteredPlaces.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 text-xs">
                        <i class="fa-solid fa-compass fa-2x mb-2 text-slate-600"></i>
                        <p>해당하는 명소가 없습니다.</p>
                    </div>
                `;
                return;
            }

            filteredPlaces.forEach(place => {
                const isSelected = place.id === currentPlaceId;
                const isBookmarked = bookmarks.includes(place.id);
                const thumbnailImg = place.gallery && place.gallery.length > 0 ? place.gallery[0].url : '';

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition-all cursor-pointer flex gap-3 ${

                }`;
                card.onclick = () => selectPlace(place.id);

                card.innerHTML = `
                    <img src="${thumbnailImg}" alt="${place.name}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-lg object-cover shrink-0 border border-slate-700/50">

                                    ${place.categoryLabel}
                                </span>

                container.appendChild(card);

        // Select Place Handler
        function selectPlace(id) {
            currentPlaceId = id;
            currentSlideIndex = 0;
            renderMapPins();
            renderPlaceList();
            renderDetailPanel(id);
        }

        // Render Right Panel Details
        function renderDetailPanel(id) {
            const place = placesData.find(p => p.id === id);
            const panel = document.getElementById('detail-panel');

                            ${gallery.length > 1 ? `<span class="text-[11px] font-bold text-amber-300 bg-slate-950/80 px-2.5 py-0.5 rounded-full border border-slate-800">${currentSlideIndex + 1} / ${gallery.length}</span>` : ''}

                </div>

                <!-- Content Body Container -->
                <div class="p-5 sm:p-7 space-y-6 flex-1">
                    
                    <!-- Quick Info Box (Address & Metro & Cost) -->

                    </div>

                    <!-- TAB 1: History -->
                    <div id="tab-content-history" class="tab-content active space-y-3">

                        </h3>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed bg-slate-900/50 border border-slate-800/80 p-4 rounded-xl whitespace-pre-line">

                        </h3>
                        <div class="grid grid-cols-1 gap-3">
                            ${place.foods.map(food => `

                                        <div class="absolute inset-0 bg-slate-950/20 hover:bg-transparent transition"></div>
                                        <span class="absolute bottom-1.5 right-1.5 bg-slate-950/80 text-amber-300 text-[10px] px-1.5 py-0.5 rounded font-bold">확대</span>
                                    </div>
                                    <div class="flex-1 flex flex-col justify-center space-y-1">

                                            <i class="fa-solid fa-utensils text-amber-400 text-xs"></i>
                                            ${food.title}
                                        </h4>
                                        <p class="text-xs text-slate-400 leading-relaxed">${food.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                </div>
            `;
        }

        // Image Gallery Slide Switcher
        function changeSlide(direction, event) {
            if (event) event.stopPropagation();
            const place = placesData.find(p => p.id === currentPlaceId);
            if (!place || !place.gallery) return;

            currentSlideIndex = (currentSlideIndex + direction + place.gallery.length) % place.gallery.length;
            renderDetailPanel(currentPlaceId);
        }

        // Image Lightbox Modal Handler
        function openImageModal(imgUrl, caption) {
            document.getElementById('modal-img').src = imgUrl;
            document.getElementById('modal-caption').innerText = caption || '';
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        // Tab Switch Controller
        function switchTab(tabName) {
            const tabs = ['history', 'activities', 'foods'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                
                if (t === tabName) {
                    btn.className = "pb-2.5 border-b-2 border-amber-400 text-amber-400 font-bold transition";
                    content.classList.add('active');
                } else {
                    btn.className = "pb-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
                    content.classList.remove('active');
                }
            });
        }

        // Category Filter Logic
        function filterCategory(cat) {
            currentFilter = cat;
            
            const buttons = document.querySelectorAll('#category-filters button');
            buttons.forEach(btn => {
                btn.className = "cat-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap";
            });

            document.getElementById(`btn-${cat}`).className = "cat-btn active px-3 py-1 rounded-lg text-xs font-medium bg-amber-400 text-slate-950 transition whitespace-nowrap font-bold";

            renderMapPins();
            renderPlaceList();
        }
